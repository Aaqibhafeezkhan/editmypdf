<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#2b57d0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#121211" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#121211"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <g transform="translate(80,76)">
    <rect width="64" height="64" rx="16" fill="#2b57d0"/>
    <rect x="14" y="19" width="36" height="8" rx="4" fill="#ffffff"/>
    <circle cx="19" cy="43" r="4.2" fill="#ffffff"/>
    <circle cx="32" cy="43" r="4.2" fill="#ffffff"/>
