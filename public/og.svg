    <rect x="266" y="496" width="178" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="355" y="527" text-anchor="middle">No account</text>
    <rect x="462" y="496" width="206" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
