  </g>
  <text x="164" y="124" font-family="Instrument Serif, Iowan Old Style, Georgia, serif" font-size="48" fill="#f3f1ec">Stet</text>
  <text x="80" y="268" font-family="Instrument Serif, Iowan Old Style, Georgia, serif" font-size="84" fill="#f3f1ec">Edit the text in a PDF</text>
  <text x="80" y="362" font-family="Instrument Serif, Iowan Old Style, Georgia, serif" font-size="84" font-style="italic" fill="#8fb0ff">without disturbing the page.</text>
  <text x="80" y="438" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#c3c0b7">Free browser PDF editor. The page's own font, no upload, no account.</text>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f3f1ec">
    <rect x="80" y="496" width="168" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
