name: Feature request
description: Something the editor or the site should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today, or can only do awkwardly?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. A sketch, a screenshot of another tool, or a sentence is all fine.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Does it fit the editor's constraints?
      description: Everything runs in the browser with nothing uploaded, and a text element must open exactly where it prints.
      options:
        - Yes, it works entirely client-side
        - Not sure
        - It would need a server
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Would you work on it?
      options:
        - label: I would like to open a pull request for this
