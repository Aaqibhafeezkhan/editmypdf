<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <title>PDF Edit — Edit the text in a PDF without disturbing the page</title>
    <meta
      name="description"
      content="Free browser PDF editor. Click any heading, line or paragraph and retype it in the page's own font, size, colour and spacing. Nothing is uploaded and no account is needed."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="PDF Edit" />
    <meta property="og:title" content="PDF Edit — Edit the text in a PDF without disturbing the page" />
    <meta
      property="og:description"
      content="Free browser PDF editor that edits the page's own text in its own font. Nothing is uploaded and no account is needed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%BASE_URL%og.png" />
    <link rel="alternate" type="application/rss+xml" title="PDF Edit blog" href="%BASE_URL%feed.xml" />
    <script>
      try {
        var stored = localStorage.getItem("pdf-editor:theme");
        var theme = stored === "light" || stored === "dark" ? stored : "system";
        var dark =
          theme === "dark" ||
          (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.js = "";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.appearance = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (error) {}
    </script>
  </head>
  <body>
    <noscript>
      <h1>PDF Edit</h1>
      <p>
        PDF Edit is a PDF editor that runs in your browser. It needs JavaScript to open, edit and save a
        PDF on your own device.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
